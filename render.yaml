# Render blueprint (free web service) for the SwiftFetch admin dashboard.
# Dashboard → New → Blueprint → select this repo. Then set the 3 env vars
# below in the service's Environment tab and deploy.
services:
  - type: web
    name: swiftfetch-admin
    runtime: node
    plan: free
    buildCommand: npm ci; npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
